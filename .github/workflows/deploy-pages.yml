name: Deploy to GitHub Pages

# Builds the client-side app and publishes `dist/` to GitHub Pages.
#
# The hledger WASM module is NOT in the repository: a ~17 MB binary pinned by
# URL and SHA-256 in `wasm.lock`, fetched at build time. That keeps the
# repository small and the artifact reproducible from its checksum, which
# matters because hledger is GPL-3.0-or-later and its corresponding source has
# to stay identifiable.
#
# Once, in the repository settings: Pages -> Source: GitHub Actions, custom
# domain hledger.gru.fi; DNS CNAME `hledger` -> `<owner>.github.io`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned, not "latest": Trunk 0.22 requires rustc 1.96.1, newer than the MSRV
  # this project targets. 0.21.14 matches Trunk.toml and the tested toolchain.
  TRUNK_VERSION: "0.21.14"
  TRUNK_TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-release

      - name: Install Trunk (pinned, checksum-verified)
        run: |
          set -eu
          base="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          curl -sSL -o /tmp/trunk.tar.gz "$base/trunk-${TRUNK_TARGET}.tar.gz"
          curl -sSL -o /tmp/trunk.sha256 "$base/trunk-${TRUNK_TARGET}.tar.gz.sha256"
          expected="$(tr -d '[:space:]' < /tmp/trunk.sha256)"
          actual="$(sha256sum /tmp/trunk.tar.gz | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Trunk tarball checksum mismatch (expected $expected, got $actual)"
            exit 1
          fi
          mkdir -p .tools/bin
          tar xzf /tmp/trunk.tar.gz -C .tools/bin trunk
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          .tools/bin/trunk --version

      - name: Fetch the pinned hledger WASM artifact
        # Explicit rather than Trunk's pre-build hook, so a missing or
        # mismatched artifact fails as its own clearly-labelled step.
        run: sh scripts/fetch-hledger-wasm.sh

      - name: Test
        # The pure modules: the line editor, the journal chooser, the engine's
        # request/response types.
        run: cargo test

      - name: Lint
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      # The browser check needs Node's built-in WebSocket: Node 22 or later.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The plugin host is written down three times — `App::host` in Rust, the
      # table in docs/plugins.md, the adapter every check builds a host from —
      # and this fails if the three disagree.
      - name: Check the host contract
        run: node scripts/check-host-contract.mjs

      # The bundled plugins are the worked example in docs/plugins.md, which
      # nothing in the Rust tests can reach.
      - name: Check the example plugin
        run: node scripts/check-example-plugin.mjs

      # Their windows in headless Chrome, which the runner image ships; also
      # measures how much of the plugins' code the two checks execute and fails
      # below 90%.
      - name: Check the plugin windows in a browser
        run: node scripts/check-plugin-windows.mjs

      # The reconcile write path: every change the window makes, written to a
      # real journal and read back, refusals and rollback beside them. No
      # browser — a write that leaves the journal wrong fails here before the
      # build ships it.
      - name: Check the reconcile write path
        run: node scripts/check-reconcile-write.mjs

      # A returning visitor must get the changed plugin file, not the cached
      # one: the service worker's network-first promise, served with the
      # ten-minute cache headers GitHub Pages sends, with the file changed
      # underneath it.
      - name: Check the service worker's freshness
        run: node scripts/check-plugin-freshness.mjs

      - name: Engine smoke test
        # The shipped engine, driven the way the app drives it: no -f, with the
        # journal exported as $LEDGER_FILE. No browser here, so a broken engine
        # or bare-command path fails before the build.
        run: |
          set -eu
          journal="$RUNNER_TEMP/journal"
          mkdir -p "$journal"
          printf '2024-01-01 * Opening\n    assets:bank:checking   $100.00\n    equity:opening\n' > "$journal/hledger.journal"
          node --experimental-wasi-unstable-preview1 scripts/hledger-wasm.mjs "$journal/hledger.journal" --version
          HLEDGER_NO_FILE_ARG=1 node --experimental-wasi-unstable-preview1 scripts/hledger-wasm.mjs "$journal/hledger.journal" balance

      - name: Build
        run: trunk build --release

      # The app itself, in a browser, against the build that was just made: the
      # wasm booting to its banner, a command answered by the engine, the
      # scrollback coming back after a reload and `clear` taking it away for
      # good. Nothing else reaches that chain, so a broken boot or a lost
      # scrollback would otherwise ship unnoticed.
      - name: Check the app in a browser
        run: node scripts/check-app.mjs

      - name: Add Pages metadata
        # Written here rather than committed: CNAME has one home, and a dotfile
        # is easy to lose to a copy rule that skips hidden files. `.nojekyll`
        # matters because without it Pages runs the output through Jekyll, which
        # drops files it considers special.
        run: |
          set -eu
          test -f dist/wasm/hledger.wasm || { echo "::error::hledger.wasm missing from dist"; exit 1; }
          # The service worker and manifest have to be at the site root to work;
          # a service worker only controls its own directory and below.
          for f in dist/sw.js dist/manifest.webmanifest dist/icons/icon-192.png; do
            test -f "$f" || { echo "::error::$f missing from dist"; exit 1; }
          done
          printf 'hledger.gru.fi\n' > dist/CNAME
          : > dist/.nojekyll
          du -sh dist
          find dist -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
