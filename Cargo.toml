[package]
name = "hledger-anywhere"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal for hledger, running entirely in the browser"
license = "AGPL-3.0-or-later"
publish = false

# Browser-only dependencies. Gating them on wasm32 keeps `cargo test` able to
# compile and run the pure modules natively: the line editor, the journal chooser
# and the engine's types have no browser in them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
idb = "0.6.5"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "Event",
    "EventTarget",
    "Storage",
    "console",
]

# Pure logic, no wasm: the line editor, the command vocabulary, choosing which
# uploaded file is the journal, and the engine's request/response types.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
