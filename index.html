<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hledger-anywhere</title>

    <link data-trunk rel="copy-dir" href="assets/css" />
    <link data-trunk rel="copy-dir" href="assets/js" />
    <link data-trunk rel="copy-dir" href="assets/wasm" />

    <link rel="stylesheet" href="/css/app.css" />

    <!--
      xterm.js, vendored (MIT): the terminal emulator. Plain scripts, not modules,
      so they have run before Trunk's deferred wasm bootstrap asks for them —
      `window.Terminal` and `window.FitAddon.FitAddon` must exist by then.
    -->
    <link rel="stylesheet" href="/js/vendor/xterm/xterm.css" />
    <script src="/js/vendor/xterm/xterm.js"></script>
    <script src="/js/vendor/xterm/addon-fit.js"></script>

    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body>
    <div id="terminal"></div>

    <!--
      The WASI bridge runs hledger on a worker thread and publishes
      window.hledgerWasi for the Rust side to call. It is a module script, so it
      is deferred automatically and cannot race the terminal's first command.
    -->
    <script type="module" src="/js/hledger-wasi.js"></script>
  </body>
</html>
