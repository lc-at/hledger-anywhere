[build]
target = "index.html"
dist = "dist"
# The hledger WASM module is large; keep asset fingerprinting off so the bridge
# can reference stable paths like /wasm/hledger.wasm.
filehash = false

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[watch]
# assets/wasm is watched so that installing a new engine — which
# scripts/fetch-hledger-wasm.sh does — is copied into dist without having to
# notice that the file that changed is the one nothing else watches.
watch = ["src", "assets/css", "assets/js", "assets/wasm", "index.html"]

# Resolve assets/wasm/hledger.wasm before every build/serve. The script is
# intentionally non-fatal: without the artifact the app still builds and runs, and
# says the engine is missing instead of failing to start.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["scripts/fetch-hledger-wasm.sh"]
