[build]
target = "index.html"
dist = "dist"
# No fingerprinting: the hledger WASM module is large and the bridge needs
# stable paths like /wasm/hledger.wasm.
filehash = false

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[watch]
# assets/wasm is watched so that installing a new engine
# (scripts/fetch-hledger-wasm.sh) is copied into dist; assets/plugins and
# assets/icons for the same reason — without them an edit was never copied and
# the served app kept running the old file.
watch = [
    "src",
    "assets/css",
    "assets/icons",
    "assets/js",
    "assets/plugins",
    "assets/wasm",
    "index.html",
]

# Resolve assets/wasm/hledger.wasm before every build/serve; intentionally
# non-fatal — without the artifact the app still builds, runs, and reports the
# engine missing instead of failing to start.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["scripts/fetch-hledger-wasm.sh"]

