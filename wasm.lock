# Pinned hledger WASM artifact descriptor.
#
# This file is the single source of truth for *which* hledger WASM binary the
# app runs against. It is read by:
#   * scripts/fetch-hledger-wasm.sh  — resolves/verifies assets/wasm/hledger.wasm
#   * build.rs                       — bakes the values in as compile-time env
#                                      vars, so the terminal can report exactly
#                                      what it is running and whether it matches
#
# `flavor` names the artifact. Only `hledger-cli` is supported: the real hledger
# CLI, whose argv is `hledger [args...]`, with the journal supplied through
# $LEDGER_FILE rather than -f. An earlier build also carried an interim npm
# artifact with a different dialect; the terminal needs neither, and it is gone.
#
# The artifact is NOT committed: it is 13 MB and changes once per hledger version,
# so it is published as a release asset and fetched at build time by
# scripts/fetch-hledger-wasm.sh. `sha256` is enforced whichever way the file
# arrives, so a wrong, stale or tampered upload is rejected rather than run.
#
# Publishing a new engine (which needs the GitHub API, hence CI rather than a
# developer machine — see .github/workflows/publish-engine.yml):
#
#   sh scripts/build-hledger-wasm.sh     # writes artifacts/hledger.wasm and
#                                        # prints its size and SHA-256
#   # set `size` and `sha256` below to those printed values
#   git tag wasm-v3 && git push origin wasm-v3
#   # CI attaches artifacts/... to that tag's release. Then set `url` to the
#   # asset URL it prints.
#
# Locally, artifacts/hledger.wasm takes precedence, so changing a build input is
# enough to change the engine without publishing anything.
#
# NOTE: keys here are read by a small awk parser, so keep the flat
# `key = "value"` form.

[hledger-wasm]
flavor = "hledger-cli"
hledger_version = "1.52.4"
ghc_version = "9.12"
size = 13194161
sha256 = "acd7c4e955b1191a23afc5171508cba960cf8311cf5f8fb8a9f62f50659e4178"
url = "https://github.com/lc-at/hledger-anywhere/releases/download/wasm-v2/hledger.wasm"
