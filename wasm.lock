# Pinned hledger WASM artifact descriptor.
#
# This file is the single source of truth for *which* hledger WASM binary the
# app runs against. It is read by:
#   * scripts/fetch-hledger-wasm.sh  — resolves/verifies assets/wasm/hledger.wasm
#   * build.rs                       — bakes the values in as compile-time env
#                                      vars, so the UI can report exactly what
#                                      it is running and whether it matches
#
# `flavor` selects how argv is assembled, because the two available artifacts
# take different command lines:
#
#   hledger-cli           the real hledger CLI. argv is
#                         `hledger -f <journal> <command> [args...]`, supports
#                         the full report/query surface and `-O json`.
#                         Built by scripts/build-hledger-wasm.sh.
#
#   hledger-wasm-bridge   the interim/fallback artifact from the
#                         `hledger-wasm@0.1.0` npm package, whose argv is
#                         `<command> <journal> [args...]`. It exposes only
#                         accounts/print/balance/aregister/commodities, always
#                         emits JSON, and accepts no report options.
#
# Target state reached: this is the real hledger CLI, built for wasm32-wasi by
# scripts/build-hledger-wasm.sh. The interim bridge artifact remains a supported
# flavor if a build ever has to fall back to it.
#
# The artifact is not committed (see .gitignore: assets/wasm/*.wasm). Locally it
# is taken from artifacts/hledger.wasm after a build; CI has no build output, so
# it downloads the release asset below. `sha256` is enforced whichever way the
# file arrives, so a wrong or stale upload is rejected rather than run.
#
# Publishing a new build (once per hledger version, not per commit):
#
#   sh scripts/build-hledger-wasm.sh          # writes artifacts/hledger.wasm
#   gh release create wasm-v1 artifacts/hledger.wasm \
#       --title "hledger 1.52.4 for wasm32-wasi" \
#       --notes  "Pinned engine build; sha256 is recorded in wasm.lock."
#
# Then set `size`, `sha256` and `url` above/below to the printed values. If the
# tag changes, the URL must change with it.
#
# NOTE: keys here are read by a small awk parser, so keep the flat
# `key = "value"` form.

[hledger-wasm]
flavor = "hledger-cli"
hledger_version = "1.52.4"
ghc_version = "9.12"
size = 13182157
sha256 = "88882bee8b0e872b393539864a72d4a1717d0e05379ea25fb7004d960329507d"
url = "https://github.com/lc-at/hledger-anywhere/releases/download/wasm-v1/hledger.wasm"
